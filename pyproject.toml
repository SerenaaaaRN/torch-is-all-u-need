[project]
name = "torch-is-all-u-need"
version = "0.1.0"
description = "Mini-library deep learning minimalis di atas NumPy dengan backpropagation manual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinytorch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
